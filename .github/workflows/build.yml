name: build

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Upstream librime repository.
        required: true
        default: rime/librime
      upstream_ref:
        description: Upstream ref to build. Leave empty to use the latest upstream release tag.
        required: false
        default: ""
      packaging_version:
        description: Release tag for this packaged artifact, for example 1.17.0-pack.9.1.0. Leave empty to infer it from existing tags, which only ever bumps the patch, so set this explicitly to make a minor or generation release.
        required: false
        default: ""
      sign_sdk:
        description: Sign and verify the dynamic SDK in a build-only run. Publishing always signs.
        required: false
        type: boolean
        default: false
      publish:
        description: Publish the GitHub Release and commit the release manifest. Set to false for a build-only run that stops after uploading the distribution artifact.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: librime-${{ github.repository }}-${{ inputs.publish && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  # Resolved once, by one job: the slices build the ref this reports, and the
  # test job must test exactly that ref for its result to say anything about
  # them. Letting each job resolve "latest" independently would let the tests
  # pass against a different upstream release than the one being shipped.
  resolve:
    name: resolve upstream ref
    runs-on: macos-15
    outputs:
      ref: ${{ steps.resolve-upstream.outputs.ref }}
    steps:
      - name: Check publication branch
        if: ${{ inputs.publish == true }}
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${REF_TYPE}" != branch || "${REF_NAME}" != "${RELEASE_BRANCH}" ]]; then
            echo "Publication must run from the repository default branch." >&2
            exit 1
          fi

      - name: Check signing configuration
        if: ${{ inputs.publish == true || inputs.sign_sdk == true }}
        env:
          SDK_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SDK_SIGNING_CERTIFICATE_P12_BASE64 }}
          SDK_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SDK_SIGNING_CERTIFICATE_PASSWORD }}
          SDK_SIGNING_IDENTITY: ${{ vars.SDK_SIGNING_IDENTITY }}
          SDK_SIGNING_TEAM_ID: ${{ vars.SDK_SIGNING_TEAM_ID }}
        run: |
          for name in SDK_SIGNING_CERTIFICATE_P12_BASE64 SDK_SIGNING_CERTIFICATE_PASSWORD SDK_SIGNING_IDENTITY SDK_SIGNING_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing signing configuration: ${name}" >&2
              exit 1
            fi
          done
          if [[ ! "${SDK_SIGNING_IDENTITY}" =~ ^[0-9A-Fa-f]{40}$ || ! "${SDK_SIGNING_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "Invalid signing certificate fingerprint or Apple team ID." >&2
            exit 1
          fi

      - name: Resolve upstream ref
        id: resolve-upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          if [[ ! "${UPSTREAM_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid upstream repository." >&2
            exit 1
          fi
          ref="${UPSTREAM_REF}"
          if [[ -z "${ref}" ]]; then
            ref="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          encoded_ref="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${ref}")"
          commit="$(gh api "repos/${UPSTREAM_REPO}/commits/${encoded_ref}" --jq .sha)"
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Upstream ref did not resolve to an immutable commit." >&2
            exit 1
          fi
          echo "ref=${commit}" >> "${GITHUB_OUTPUT}"

  build-slice:
    name: build ${{ matrix.platform }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}/.vcpkg-binary-cache
      # `clear;` drops the default sources, so the files-based source below is
      # the only one and states its path explicitly. That makes
      # VCPKG_DEFAULT_BINARY_CACHE redundant - it configures where the *default*
      # source would cache, and there is no default source left.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: macos-x86_64
            runner: macos-15
            platform: macos-x86_64
          - slice: macos-arm64
            runner: macos-15
            platform: macos-arm64
          - slice: ios-arm64
            runner: macos-15
            platform: ios-arm64
          - slice: ios-simulator-arm64
            runner: macos-15
            platform: ios-simulator-arm64
          - slice: ios-simulator-x86_64
            runner: macos-15
            platform: ios-simulator-x86_64
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-binary-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'triplets/*.cmake', 'ports/**') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ matrix.platform }}-

      - name: Checkout upstream librime
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.upstream_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: vendor/librime

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: "vcpkg.json"

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Build slice
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          UPSTREAM_SOURCE_DIR: ${{ github.workspace }}/vendor/librime
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_REF: ${{ needs.resolve.outputs.ref }}
          PACKAGING_VERSION: ${{ inputs.packaging_version }}
        run: scripts/build-one-arch.sh ${{ matrix.slice }}

      - name: Upload slice
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: out/${{ matrix.platform }}

  # Upstream's own suite plus the plugins' behavioral tests, run against the
  # same upstream ref, patches and merged plugins the artifacts are built from.
  # The point is to catch this repository's packaging layer breaking librime
  # itself: a suite run against an unpatched checkout could not report that.
  #
  # The procedure lives in run-tests.yml, shared with the pull request check in
  # test.yml, so there is one definition of what the tests are. The ref is passed
  # in from `resolve` rather than resolved again inside, so this job and the
  # slices it gates cannot disagree about what is being tested.
  test:
    name: test
    needs: resolve
    uses: ./.github/workflows/run-tests.yml
    with:
      upstream_repo: ${{ inputs.upstream_repo }}
      upstream_ref: ${{ needs.resolve.outputs.ref }}


  package:
    name: package
    permissions:
      contents: write
    # Tests gate packaging: a suite that fails means this packaging layer breaks
    # librime, and nothing should be released from it.
    needs: [build-slice, test]
    runs-on: macos-15
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download arm64 slice
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: out/macos-arm64

      - name: Download x86_64 slice
        uses: actions/download-artifact@v8
        with:
          name: macos-x86_64
          path: out/macos-x86_64

      - name: Download iOS device slice
        uses: actions/download-artifact@v8
        with:
          name: ios-arm64
          path: out/ios-arm64

      - name: Download iOS simulator arm64 slice
        uses: actions/download-artifact@v8
        with:
          name: ios-simulator-arm64
          path: out/ios-simulator-arm64

      - name: Download iOS simulator x86_64 slice
        uses: actions/download-artifact@v8
        with:
          name: ios-simulator-x86_64
          path: out/ios-simulator-x86_64

      - name: Import source metadata
        run: grep -E '^(UPSTREAM_REPO|UPSTREAM_REF|UPSTREAM_VERSION|UPSTREAM_COMMIT)=' out/macos-arm64/source.env >> "${GITHUB_ENV}"

      - name: Resolve packaging version
        run: |
          version="$(scripts/resolve-packaging-version.sh)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pack\.[0-9]+\.[0-9]+\.[0-9]+$ || "${version}" != "${UPSTREAM_VERSION}-pack."* ]]; then
            echo "Packaging version must match the upstream version and packaging version format." >&2
            exit 1
          fi
          echo "PACKAGING_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "packaging version: ${version}"
        env:
          PACKAGING_VERSION: ${{ inputs.packaging_version }}

      - name: Check SDK privacy tooling
        run: |
          python3 scripts/test-sdk-privacy.py
          python3 scripts/test-source-snapshot.py
          python3 scripts/test-release.py

      - name: Package XCFramework
        run: scripts/package-xcframework.sh

      - name: Sign dynamic SDK
        if: ${{ inputs.publish == true || inputs.sign_sdk == true }}
        env:
          SDK_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SDK_SIGNING_CERTIFICATE_P12_BASE64 }}
          SDK_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SDK_SIGNING_CERTIFICATE_PASSWORD }}
          SDK_SIGNING_IDENTITY: ${{ vars.SDK_SIGNING_IDENTITY }}
          SDK_SIGNING_TEAM_ID: ${{ vars.SDK_SIGNING_TEAM_ID }}
        run: scripts/sign-ci-sdk.sh dist

      # The final signed ZIP must exist before either checksum is recorded.
      - name: Generate SwiftPM manifest
        run: |
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${PACKAGING_VERSION}"
          static_checksum="$(swift package compute-checksum dist/librime-static.xcframework.zip)"
          dynamic_checksum="$(swift package compute-checksum dist/librime-dynamic.xcframework.zip)"
          scripts/write-package-swift.sh \
            "${release_base_url}/librime-static.xcframework.zip" "${static_checksum}" \
            "${release_base_url}/librime-dynamic.xcframework.zip" "${dynamic_checksum}" \
            Package.swift

      - name: Write build metadata
        run: scripts/write-build-metadata.sh dist/build-metadata.json

      - name: Verify final release inputs
        env:
          SIGNED: ${{ inputs.publish == true || inputs.sign_sdk == true }}
          SDK_SIGNING_TEAM_ID: ${{ vars.SDK_SIGNING_TEAM_ID }}
        run: |
          if [[ "${SIGNED}" == true ]]; then
            python3 scripts/verify-release.py distribution \
              --repository "${GITHUB_REPOSITORY}" --version "${PACKAGING_VERSION}" \
              --source-commit "${GITHUB_SHA}" --slices out --signed --team-id "${SDK_SIGNING_TEAM_ID}"
          else
            python3 scripts/verify-release.py distribution \
              --repository "${GITHUB_REPOSITORY}" --version "${PACKAGING_VERSION}" \
              --source-commit "${GITHUB_SHA}" --slices out
          fi

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: librime-xcframework
          path: |
            dist/librime-static.xcframework.zip
            dist/librime-dynamic.xcframework.zip
            dist/librime-stub.zip
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.md
            dist/third-party-notices.zip
            dist/build-metadata.json
            Package.swift
            Sources/RimeHeaders
            Sources/RimeSystem
            Sources/RimeOpenCCData

      - name: Commit, tag and publish verified release
        if: ${{ inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          SDK_SIGNING_TEAM_ID: ${{ vars.SDK_SIGNING_TEAM_ID }}
        run: scripts/publish-release.sh

      - name: Summarize build-only run
        if: ${{ inputs.publish != true }}
        env:
          SIGNED: ${{ inputs.sign_sdk }}
        run: |
          {
            echo "### Build-only run: nothing was published"
            echo
            echo "Packaged ${UPSTREAM_REPO}@${UPSTREAM_REF} as ${PACKAGING_VERSION}."
            echo "Dynamic SDK signed: ${SIGNED}."
            echo "No commit, tag, push or GitHub Release was created."
            echo "The artifact includes dist/ and generated SwiftPM source for inspection."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean temporary signing material
        if: ${{ always() && (inputs.publish == true || inputs.sign_sdk == true) }}
        run: scripts/sign-ci-sdk.sh --cleanup
